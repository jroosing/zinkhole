# zinkhole CI (docs/adr/0003).
#
#   every push   formatting, shellcheck, unit tests (offline), config check,
#                cross-build smoke test, and a trial build of the release files
#   tag v<x.y.z> also: check the tag against build.zig.zon, build the release
#                files, and publish them as a public GitLab release
#
# To release: bump `.version` in build.zig.zon, commit, then
#   git tag v<version> && git push origin v<version>
#
# The logic lives in deploy/ci/*.sh, so every step also runs locally in an
# Alpine container.

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG

default:
  image: alpine:3.24.2

stages: [test, build, release]

test:
  stage: test
  variables:
    # GitLab only caches paths inside the project directory.
    ZIG_GLOBAL_CACHE_DIR: $CI_PROJECT_DIR/.zig-global-cache
  before_script:
    - apk add --no-cache coreutils shellcheck >/dev/null
    - sh deploy/ci/install-zig.sh
  script:
    - zig fmt --check src build.zig
    - shellcheck -x deploy/proxmox/*.sh deploy/ci/*.sh deploy/install.sh deploy/sync/test.sh
    - zig build test
    - zig build
    - ./zig-out/bin/zinkhole --check -c config.example.yaml
    # Every platform the README promises must still compile.
    - zig build --release -Dstrip=true -Dtarget=aarch64-linux-musl
    - zig build --release -Dstrip=true -Dtarget=arm-linux-musleabihf
    # The release files (binaries, Proxmox scripts, deploy bundle) must build.
    - sh deploy/ci/release.sh build
  cache:
    key: zig-0.17.0
    paths:
      - .zig-cache/
      - .zig-global-cache/

build:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  needs: [test]
  before_script:
    - apk add --no-cache coreutils >/dev/null
    - sh deploy/ci/install-zig.sh
  script:
    - sh deploy/ci/release.sh check-tag "$CI_COMMIT_TAG"
    - sh deploy/ci/release.sh build
  artifacts:
    paths: [dist/]
    expire_in: 1 day

release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  needs: [build]
  before_script:
    - apk add --no-cache curl jq coreutils >/dev/null
  script:
    - sh deploy/ci/release.sh publish
